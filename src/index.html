<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A R O Shop</title>
    <link rel="stylesheet" href="./output.css">
    <script src="./main.js" defer></script>
    <link rel="shortcut icon" href="../asset/images/icon/2.png" type="image/x-icon">

</head>

<body>

    <header
        style="background-image: url(../asset/images/header/BG.png); background-repeat: no-repeat; background-size:cover;">
        <div class="max-w-screen-2xl mx-auto relative">

            <!--mobile container-->
            <div class="flex justify-between items-center md:hidden p-8">
                <div class="flex items-center">
                    <img src="../asset/images/icon/3.png" alt="logo" width="80px">
                    <h2 class="text-amber-50 absolute left-16">A R O</h2>
                </div>
                <div onclick="toggleSidebar()"><img src="../asset/images/icon/bar.svg" alt="iconbar" width="44px"></div>
            </div>

            <div id="Sidebar"
                class="fixed top-0 right-0 translate-x-full w-10/10 shadow-xl duration-1000 bg-amber-50 flex justify-between items-start  z-30 rounded-2xl ">
                <div class="px-4 mt-28 mb-12">
                    <ul>
                        <li class="cursor-pointer hover:text-prim transition-all duration-300 mb-2">- Men</li>
                        <li class="cursor-pointer hover:text-prim transition-all duration-300 mb-2">- Women</li>
                        <li class="cursor-pointer hover:text-prim transition-all duration-300 mb-2">- Jewelry</li>
                        <li class="cursor-pointer hover:text-prim transition-all duration-300 mb-2">- Tech</li>
                    </ul>
                </div>
                <img class="p-0.5 cursor-pointer shadow-2xl mt-4 mr-6" src="../asset/images/icon/cancel.svg"
                    alt="cancel" width="24px" onclick="toggleSidebar()">
            </div>

            <!--desktop container-->
            <div class="hidden lg:flex justify-between p-6 items-center">
                <div class="flex items-center">
                    <img src="../asset/images/icon/3.png" alt="logo" width="80px">
                    <h2 class="text-amber-50 absolute left-16">A R O</h2>
                </div>

                <nav>
                    <ul class="flex text-amber-50 gap-5">
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            HOME
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                        </li>
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            SHOP
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                            <div
                                class="hidden group-hover:block bg-amber-50 h-10 absolute z-30 w-full top-10 left-0 transition-all duration-300">
                            </div>
                        </li>
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            PRODUCT
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                            <div
                                class="hidden group-hover:block bg-amber-50 h-10 absolute z-30 w-full top-10 left-0 transition-all duration-300">
                            </div>
                        </li>
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            BLOG
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                            <div
                                class="hidden group-hover:block bg-amber-50 h-10 absolute z-30 w-full top-10 left-0 transition-all duration-300">
                            </div>
                        </li>
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            PAGES
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                            <div
                                class="hidden group-hover:block bg-amber-50 h-10 absolute z-30 w-full top-10 left-0 transition-all duration-300">
                            </div>
                        </li>
                        <li class="group relative cursor-pointer flex gap-0.5 items-center">
                            CONTACT
                            <img src="../asset/images/icon/arrow.svg" alt="arrow" width="12px">
                            <span
                                class="absolute left-0 -bottom-1 h-0.5 w-0 bg-prim transition-all duration-300 group-hover:w-full"></span>
                            <div
                                class="hidden group-hover:block bg-amber-50 h-10 absolute z-30 w-full top-10 left-0 transition-all duration-1000">
                            </div>
                        </li>
                    </ul>
                </nav>

                <div class="flex text-amber-50 gap-4 items-center">
                    <div><a href="#">REGISTER/LOGIN</a></div>
                    <img class="cursor-pointer" src="../asset/images/icon/search.svg" alt="icon search" width="20px">
                    <img class="cursor-pointer" src="../asset/images/icon/like.svg" alt="icon fav" width="20px">
                    <img class="cursor-pointer" src="../asset/images/icon/shopping.svg" alt="icon shop cart"
                        width="20px">
                </div>
            </div>

            <!-- Slide container -->
            <div
                class="slide-container flex gap-7 md:gap-16 justify-evenly px-7 md:pt-9 relative flex-col-reverse items-center md:flex-row">
                <!-- Slides will be inserted here by JS -->
            </div>

            <!-- Slide navigation -->
            <div class="text-amber-50 ml-28 pb-5 flex gap-1">
                <div class="flex gap-1 cursor-pointer btn-left">
                    <img src="../asset/images/icon/left-arrow.svg" alt="" width="16px">
                    <span class="hover:text-prim transition-all duration-300">01</span>
                </div>
                <div>/</div>
                <div class="flex gap-1 cursor-pointer btn-right">
                    <span class="hover:text-prim transition-all duration-300">02</span>
                    <img src="../asset/images/icon/right-arrow.svg" alt="" width="16px">
                </div>
            </div>
        </div>

    </header>

    <!--bottom navigation bar-->
    <div class="fixed bottom-0 left-0 w-full flex border-t border-gray-300 bg-white md:hidden">
        <div class="flex-1 flex flex-col items-center justify-center py-1 group">
            <img src="../asset/images/icon/search-black.svg" alt="icon-search" width="20px"
                class="transition-transform duration-200 group-hover:-translate-y-1">
            <h3 class="text-sm mt-1">Search</h3>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center py-1 border-l border-gray-300 group">
            <img src="../asset/images/icon/user.svg" alt="icon-user" width="20px"
                class="transition-transform duration-200 group-hover:-translate-y-1">
            <h3 class="text-sm mt-1">Account</h3>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center py-1 border-l border-gray-300 group">
            <img src="../asset/images/icon/shopping-cart-round.svg" alt="icon-cart" width="20px"
                class="transition-transform duration-200 group-hover:-translate-y-1">
            <h3 class="text-sm mt-1">Cart</h3>
        </div>
    </div>
</body>

</html>
